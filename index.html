<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Event Photobooth</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
      }
      .card {
        background: #1e293b;
        width: 100%;
        max-width: 480px;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      h2 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        color: #38bdf8;
      }
      .counter {
        font-size: 1rem;
        font-weight: 600;
        background: #334155;
        padding: 6px 16px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 16px;
      }
      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 3/4;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mirror {
        transform: scaleX(-1);
      }
      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash.active {
        opacity: 0.8;
      }

      .controls {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        color: white;
        border: none;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        background: #475569 !important;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .btn-snap {
        background: #ef4444;
      }
      .btn-upload {
        background: #3b82f6;
      }
      .btn-switch {
        flex: 0 0 50px;
        background: #334155;
        font-size: 1.2rem;
      }
      .btn-full {
        width: 100%;
        flex: 100%;
        margin-top: 4px;
      }
      .btn-cam-off {
        background: #64748b;
      }
      .btn-cam-on {
        background: #10b981;
      }
      .btn-album {
        background: #8b5cf6;
      }

      #status {
        margin-top: 14px;
        font-size: 0.85rem;
        color: #94a3b8;
        min-height: 20px;
        line-height: 1.4;
      }

      .gallery-container {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-behavior: smooth;
      }
      .gallery-item {
        position: relative;
        flex-shrink: 0;
      }
      .gallery-item img {
        width: 60px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #38bdf8;
        background: #334155;
      }
      .delete-btn {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
        border: 2px solid #1e293b;
      }

      /* Modal Album */
      .modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        overflow-y: auto;
        padding: 20px;
      }
      .modal-content {
        background: #1e293b;
        margin: auto;
        padding: 20px;
        border-radius: 16px;
        max-width: 480px;
        text-align: center;
      }
      .close-modal {
        color: #94a3b8;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }
      .close-modal:hover {
        color: white;
      }
      .album-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }
      .album-grid img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📸 Event Photobooth</h2>
      <div class="counter" id="counter">Foto: 0 / 35</div>

      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline class="mirror"></video>
        <div id="flash" class="flash"></div>
      </div>

      <div class="controls">
        <button id="switchBtn" class="btn btn-switch" onclick="switchCamera()">
          🔄
        </button>
        <button
          id="snapBtn"
          class="btn btn-snap"
          onclick="takePhoto()"
          disabled
        >
          📷 Jepret
        </button>
        <button
          id="uploadBtn"
          class="btn btn-upload"
          onclick="document.getElementById('fileInput').click()"
        >
          📁 Upload
        </button>

        <button
          id="toggleCamBtn"
          class="btn btn-full btn-cam-off"
          onclick="toggleCamera()"
        >
          ⏹ Matikan Kamera
        </button>
        <button
          id="albumBtn"
          class="btn btn-full btn-album"
          onclick="openAlbum()"
        >
          🖼️ Lihat Album Keseluruhan
        </button>
      </div>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        style="display: none"
        onchange="handleFileUpload(event)"
      />
      <div id="status">Meminta akses kamera...</div>

      <div class="gallery-container" id="gallery"></div>
    </div>

    <!-- Modal Album -->
    <div id="albumModal" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeAlbum()">&times;</span>
        <h2 style="color: #38bdf8">Album Foto</h2>
        <div id="albumGrid" class="album-grid"></div>
      </div>
    </div>

    <canvas id="canvas" style="display: none"></canvas>

    <script>
      // MASUKKAN LINK APPS SCRIPT KAMU DI BAWAH INI
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbw_FxfrcqdH0H9KYEWB0YhWWOspfJMQ9_auLuBN2_UTRNVuStrahkkaKHNiH_4Uw2zUGg/exec";

      let photoCount = 0;
      const MAX_PHOTOS = 35;
      let currentStream = null;
      let useFacingMode = "user";
      let isCameraOn = true;
      let photoAlbumData = []; // Menyimpan data base64 untuk album

      function updateStatus(msg) {
        document.getElementById("status").innerHTML = msg;
      }

      function initCamera() {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
        }

        const constraints = {
          video: {
            facingMode: useFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 960 },
          },
          audio: false,
        };

        navigator.mediaDevices
          .getUserMedia(constraints)
          .then((stream) => {
            currentStream = stream;
            const video = document.getElementById("webcam");
            video.srcObject = stream;
            if (useFacingMode === "user") {
              video.classList.add("mirror");
            } else {
              video.classList.remove("mirror");
            }
            if (photoCount < MAX_PHOTOS) {
              document.getElementById("snapBtn").disabled = false;
            }
            updateStatus("Kamera siap! Silakan jepret foto.");
          })
          .catch((err) => {
            updateStatus(
              '<span style="color:#ef4444; font-weight:bold;">⚠️ Kamera tidak diizinkan/tidak tersedia.</span>',
            );
            document.getElementById("snapBtn").disabled = true;
          });
      }

      function switchCamera() {
        if (!isCameraOn) return;
        useFacingMode = useFacingMode === "user" ? "environment" : "user";
        initCamera();
      }

      function toggleCamera() {
        const btn = document.getElementById("toggleCamBtn");
        if (isCameraOn) {
          // Matikan kamera
          if (currentStream) {
            currentStream.getTracks().forEach((track) => track.stop());
            currentStream = null;
          }
          document.getElementById("webcam").srcObject = null;
          document.getElementById("snapBtn").disabled = true;
          document.getElementById("switchBtn").disabled = true;
          btn.innerText = "▶ Nyalakan Kamera";
          btn.classList.replace("btn-cam-off", "btn-cam-on");
          updateStatus("Kamera dimatikan.");
          isCameraOn = false;
        } else {
          // Nyalakan kamera
          initCamera();
          document.getElementById("switchBtn").disabled = false;
          btn.innerText = "⏹ Matikan Kamera";
          btn.classList.replace("btn-cam-on", "btn-cam-off");
          isCameraOn = true;
        }
      }

      function triggerFlash() {
        const flash = document.getElementById("flash");
        flash.classList.add("active");
        setTimeout(() => flash.classList.remove("active"), 150);
      }

      function addToGallery(base64Data) {
        photoAlbumData.push(base64Data);
        const gallery = document.getElementById("gallery");
        const itemWrapper = document.createElement("div");
        itemWrapper.className = "gallery-item";

        const img = document.createElement("img");
        img.src = base64Data;

        const delBtn = document.createElement("div");
        delBtn.className = "delete-btn";
        delBtn.innerHTML = "✖";
        delBtn.onclick = function () {
          itemWrapper.remove();
          photoCount--;

          // Hapus dari data album
          const index = photoAlbumData.indexOf(base64Data);
          if (index > -1) {
            photoAlbumData.splice(index, 1);
          }

          document.getElementById("counter").innerText =
            `Foto: ${photoCount} / ${MAX_PHOTOS}`;
          if (photoCount < MAX_PHOTOS && isCameraOn) {
            document.getElementById("snapBtn").disabled = false;
          }
          updateStatus("Foto dihapus dari layar.");
        };

        itemWrapper.appendChild(img);
        itemWrapper.appendChild(delBtn);
        gallery.appendChild(itemWrapper);
        gallery.scrollLeft = gallery.scrollWidth;
      }

      function processAndUpload(base64Data) {
        if (photoCount >= MAX_PHOTOS) return;

        photoCount++;
        document.getElementById("counter").innerText =
          `Foto: ${photoCount} / ${MAX_PHOTOS}`;
        addToGallery(base64Data);
        updateStatus(`Mengunggah foto ke-${photoCount}...`);

        if (photoCount >= MAX_PHOTOS) {
          document.getElementById("snapBtn").disabled = true;
          updateStatus(
            "Sesi penuh (Maksimal 35 foto). Hapus foto untuk menjepret lagi.",
          );
        }

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ image: base64Data, photoIndex: photoCount }),
          headers: { "Content-Type": "text/plain;charset=utf-8" },
        })
          .then((response) => response.json())
          .then((res) => {
            if (res.success) {
              updateStatus(`Foto ke-${photoCount} tersimpan di Drive!`);
            } else {
              updateStatus("Gagal unggah: " + res.error);
            }
          })
          .catch((error) => {
            updateStatus("Terjadi kesalahan jaringan saat mengunggah.");
          });
      }

      function takePhoto() {
        triggerFlash();
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const ctx = canvas.getContext("2d");
        if (useFacingMode === "user") {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const base64Data = canvas.toDataURL("image/jpeg", 0.85);

        processAndUpload(base64Data);
      }

      function handleFileUpload(event) {
        const files = event.target.files;
        if (files.length > 0) {
          Array.from(files).forEach((file) => {
            if (photoCount < MAX_PHOTOS) {
              const reader = new FileReader();
              reader.onload = function (e) {
                const base64Data = e.target.result;
                processAndUpload(base64Data);
              };
              reader.readAsDataURL(file);
            }
          });
          event.target.value = "";
        }
      }

      function openAlbum() {
        const modal = document.getElementById("albumModal");
        const grid = document.getElementById("albumGrid");
        grid.innerHTML = "";

        if (photoAlbumData.length === 0) {
          grid.innerHTML =
            '<p style="color:white; grid-column: span 3;">Belum ada foto yang diambil.</p>';
        } else {
          photoAlbumData.forEach((src) => {
            const img = document.createElement("img");
            img.src = src;
            grid.appendChild(img);
          });
        }
        modal.style.display = "block";
      }

      function closeAlbum() {
        document.getElementById("albumModal").style.display = "none";
      }

      window.onclick = function (event) {
        const modal = document.getElementById("albumModal");
        if (event.target == modal) {
          closeAlbum();
        }
      };

      initCamera();
    </script>
  </body>
</html>
