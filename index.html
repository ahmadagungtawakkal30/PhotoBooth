<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Event Photobooth</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }

      .card {
        background: #1e293b;
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      h2 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        color: #38bdf8;
      }
      .counter {
        font-size: 1rem;
        font-weight: 600;
        background: #334155;
        padding: 6px 16px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 16px;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 3/4;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mirror {
        transform: scaleX(-1);
      }

      /* Indikator Kamera Off di dalam video */
      .cam-off-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: #94a3b8;
        display: none;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.1rem;
        z-index: 5;
      }

      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
        z-index: 6;
      }
      .flash.active {
        opacity: 0.8;
      }

      .controls {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        color: white;
        border: none;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        background: #475569 !important;
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }

      .btn-snap {
        background: #ef4444;
      }
      .btn-upload {
        background: #3b82f6;
      }
      .btn-switch {
        flex: 0 0 50px;
        background: #334155;
        font-size: 1.2rem;
      }
      .btn-full {
        width: 100%;
        flex: 100%;
        margin-top: 4px;
      }
      .btn-cam-off {
        background: #64748b;
      }
      .btn-cam-on {
        background: #10b981;
      }
      .btn-album {
        background: #8b5cf6;
      }
      .btn-finish {
        background: #059669;
      }

      #status {
        margin-top: 14px;
        font-size: 0.85rem;
        color: #94a3b8;
        min-height: 20px;
        line-height: 1.4;
        font-weight: 500;
      }

      .gallery-container {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-behavior: smooth;
      }
      .gallery-item {
        position: relative;
        flex-shrink: 0;
      }
      .gallery-item img {
        width: 60px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #38bdf8;
        background: #334155;
      }
      .upload-progress {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 6px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.82);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        text-align: center;
      }
      .upload-progress-track {
        width: 100%;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #475569;
      }
      .upload-progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #38bdf8;
        transition: width 0.15s ease;
      }
      .upload-progress.is-complete .upload-progress-fill {
        background: #10b981;
      }
      .upload-progress.is-error .upload-progress-fill {
        background: #ef4444;
      }
      .delete-btn {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 14px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
        border: 2px solid #1e293b;
      }

      /* Modal Album */
      .modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        overflow-y: auto;
        padding: 20px;
        backdrop-filter: blur(5px);
      }
      .modal-content {
        background: #1e293b;
        margin: 40px auto;
        padding: 24px;
        border-radius: 16px;
        max-width: 600px;
        text-align: center;
      }
      .close-modal {
        color: #94a3b8;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .close-modal:hover {
        color: #ef4444;
      }

      .album-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .album-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .album-card img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #334155;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .album-image-error {
        display: flex;
        aspect-ratio: 3/4;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid #475569;
        border-radius: 8px;
        color: #fca5a5;
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }
      .album-image-error[hidden] {
        display: none;
      }
      .album-image-error a {
        color: #7dd3fc;
        text-decoration: underline;
      }
      .like-btn {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 8px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: 0.2s;
      }
      .like-btn:hover {
        background: #475569;
      }
      .like-btn:active {
        transform: scale(0.95);
      }
      .like-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @media (min-width: 768px) {
        .card {
          max-width: 600px;
          padding: 30px;
        }
        h2 {
          font-size: 1.8rem;
        }
        .counter {
          font-size: 1.1rem;
        }
        .btn {
          font-size: 1.1rem;
          padding: 16px;
        }
        .gallery-item img {
          width: 75px;
          height: 100px;
        }
        .album-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      body {
        --accent: #e8bd83;
        --accent-light: #ffe2b5;
        --surface: rgba(20, 20, 24, 0.88);
        --muted: #a7a3a0;
        justify-content: flex-start;
        padding: clamp(18px, 4vw, 48px) 16px;
        background:
          radial-gradient(ellipse at 50% -15%, rgba(147, 87, 67, 0.28), transparent 44%),
          radial-gradient(ellipse at 100% 70%, rgba(89, 61, 52, 0.16), transparent 35%),
          #0b0b0d;
        color: #f7f3ed;
      }

      .card {
        max-width: 510px;
        padding: clamp(18px, 4vw, 30px);
        border: 1px solid rgba(232, 189, 131, 0.17);
        border-radius: 26px;
        background: linear-gradient(145deg, rgba(30, 29, 31, 0.97), rgba(17, 17, 19, 0.97));
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.56),
          0 1px 0 rgba(255, 255, 255, 0.04) inset;
        text-align: left;
        animation: card-arrive 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .card > h2 {
        margin: 0 0 4px;
        color: var(--accent-light);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.7rem, 6vw, 2.2rem);
        font-weight: 500;
        letter-spacing: -0.045em;
      }

      .card > h2::before {
        display: block;
        margin-bottom: 8px;
        color: var(--accent);
        content: "THE MOMENT STUDIO  /  PHOTOBOOTH";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.64rem;
        font-weight: 700;
        letter-spacing: 0.2em;
      }

      .counter {
        margin: 8px 0 18px;
        padding: 7px 12px;
        border: 1px solid rgba(232, 189, 131, 0.22);
        border-radius: 999px;
        background: rgba(232, 189, 131, 0.08);
        color: #e6d6c1;
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }

      .video-wrapper {
        aspect-ratio: 4 / 3;
        border: 1px solid rgba(255, 226, 181, 0.22);
        border-radius: 20px;
        background:
          radial-gradient(circle at center, rgba(232, 189, 131, 0.08), transparent 55%),
          #050506;
        box-shadow:
          0 14px 36px rgba(0, 0, 0, 0.32),
          0 0 0 5px rgba(232, 189, 131, 0.035);
      }

      video {
        filter: saturate(1.04) contrast(1.02);
      }

      .cam-off-overlay {
        background: rgba(10, 10, 12, 0.94);
        color: var(--accent-light);
        letter-spacing: 0.04em;
      }

      .controls {
        gap: 10px;
        margin-top: 16px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr);
        align-items: center;
      }

      .btn {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        min-height: 48px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        background: #272629;
        color: #f8f3ec;
        font-size: 0.92rem;
        font-weight: 650;
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
        transition:
          transform 180ms ease,
          filter 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.12);
        border-color: rgba(255, 226, 181, 0.34);
        box-shadow: 0 9px 22px rgba(0, 0, 0, 0.28);
      }

      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn-snap {
        position: relative;
        grid-column: 1 / -1;
        grid-row: 1;
        min-height: 72px;
        border: 0;
        border: 1px solid rgba(255, 242, 222, 0.62);
        border-radius: 20px;
        background: linear-gradient(115deg, #f5d6a8 0%, #d7a16d 52%, #bd8054 100%);
        color: #21160f;
        font-size: 1.12rem;
        letter-spacing: 0.015em;
        box-shadow:
          0 10px 28px rgba(196, 132, 79, 0.27),
          0 1px 0 rgba(255, 255, 255, 0.45) inset;
        overflow: hidden;
      }

      .btn-snap::after {
        position: absolute;
        inset: 5px;
        border: 1px solid rgba(66, 42, 24, 0.18);
        border-radius: 15px;
        content: "";
        pointer-events: none;
      }

      .btn-snap:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.01);
        filter: brightness(1.06);
        box-shadow:
          0 14px 34px rgba(196, 132, 79, 0.36),
          0 1px 0 rgba(255, 255, 255, 0.5) inset;
      }

      .btn-switch {
        grid-column: 1;
        grid-row: 2;
        width: 100%;
      }

      .btn-upload {
        grid-column: 3;
        grid-row: 2;
      }

      .controls .btn-full {
        grid-column: 1 / -1;
      }

      .btn-upload,
      .btn-switch {
        background: #28272a;
        color: #eee5da;
      }

      .btn-switch {
        flex-basis: 52px;
      }

      .btn-full {
        flex: 100%;
        margin-top: 2px;
      }

      .btn-cam-off,
      .btn-cam-on {
        background: #242326;
        color: #d7c7b5;
      }

      .btn-album {
        border-color: rgba(232, 189, 131, 0.25);
        background: rgba(232, 189, 131, 0.09);
        color: var(--accent-light);
      }

      .btn-finish {
        border-color: transparent;
        background: transparent;
        color: #999398;
        box-shadow: none;
      }

      #status {
        min-height: 24px;
        margin-top: 17px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .gallery-container {
        gap: 11px;
        margin-top: 18px;
        padding: 4px 2px 10px;
        scrollbar-color: #685442 transparent;
        scrollbar-width: thin;
      }

      .gallery-item img {
        width: 66px;
        height: 82px;
        border: 1px solid rgba(255, 226, 181, 0.38);
        border-radius: 12px;
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.28);
      }

      .upload-progress {
        border-radius: 12px;
        background: rgba(12, 12, 14, 0.88);
        color: var(--accent-light);
      }

      .upload-progress-fill {
        background: var(--accent);
      }

      .delete-btn {
        top: -5px;
        right: -5px;
        width: 22px;
        height: 22px;
        border-color: #19181a;
        background: #b94e48;
      }

      .modal {
        padding: clamp(12px, 3vw, 28px);
        background: rgba(5, 5, 7, 0.82);
        backdrop-filter: blur(14px);
      }

      .modal-content {
        max-width: 1000px;
        margin: clamp(14px, 5vh, 48px) auto;
        padding: clamp(18px, 4vw, 34px);
        border: 1px solid rgba(232, 189, 131, 0.2);
        border-radius: 24px;
        background: linear-gradient(145deg, #201e20, #141315);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.56);
        text-align: left;
        animation: modal-arrive 260ms ease-out both;
      }

      .modal-content > h2 {
        margin: 0 0 5px !important;
        color: var(--accent-light) !important;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.65rem, 5vw, 2.1rem);
        font-weight: 500;
      }

      .modal-content > h2::after {
        display: block;
        margin-top: 5px;
        color: #aaa1a0;
        content: "Momen terbaik, tersimpan untuk dikenang";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .close-modal {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        color: #ded4c9;
        font-size: 24px;
        line-height: 1;
        transition: 180ms ease;
      }

      .close-modal:hover {
        transform: rotate(90deg);
        border-color: rgba(232, 189, 131, 0.45);
        color: var(--accent-light);
      }

      .album-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .album-card {
        min-width: 0;
        gap: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.085);
        border-radius: 17px;
        background: #1d1b1e;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        transition:
          transform 220ms ease,
          border-color 220ms ease,
          box-shadow 220ms ease;
        animation: card-arrive 380ms ease both;
      }

      .album-card:hover {
        transform: translateY(-4px);
        border-color: rgba(232, 189, 131, 0.36);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32);
      }

      .album-card::before {
        display: block;
        padding: 12px 12px 10px 38px;
        background:
          radial-gradient(circle at 19px center, #d6a77a 0 10px, #6e5140 11px 13px, transparent 14px),
          #1d1b1e;
        color: #eee1d1;
        content: "MOMENT STUDIO";
        font-size: 0.62rem;
        font-weight: 750;
        letter-spacing: 0.14em;
      }

      .album-card img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 4.7;
        border: 0;
        border-radius: 0;
        background: #111;
        box-shadow: none;
        object-fit: cover;
        transition: transform 350ms ease;
      }

      .album-card:hover img {
        transform: scale(1.025);
      }

      .album-image-error {
        aspect-ratio: 4 / 4.7;
        border: 0;
        border-radius: 0;
        background: #171518;
        color: #e3b6a8;
      }

      .album-image-error a {
        color: var(--accent-light);
      }

      .like-btn {
        min-height: 44px;
        padding: 10px 13px;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 0;
        background: #1d1b1e;
        color: #e9dfd4;
        font-size: 0.9rem;
        justify-content: flex-start;
      }

      .like-btn:hover {
        background: #292529;
      }

      .like-btn:active {
        transform: scale(0.98);
      }

      @keyframes card-arrive {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes modal-arrive {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 600px), (max-height: 500px) and (pointer: coarse) {
        body {
          min-height: 100vh;
          min-height: 100dvh;
          padding: 0;
          overflow: hidden;
          align-items: stretch;
        }

        .card {
          position: relative;
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 0;
          padding: 0;
          overflow: hidden;
          border: 0;
          border-radius: 0;
          background: #080809;
          box-shadow: none;
          text-align: center;
        }

        .card > h2 {
          position: absolute;
          z-index: 8;
          top: calc(env(safe-area-inset-top, 0px) + 14px);
          left: 18px;
          margin: 0;
          color: #fff1dc;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          font-size: 1.05rem;
          font-weight: 650;
          letter-spacing: 0;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
        }

        .card > h2::before {
          display: none;
        }

        .video-wrapper {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          aspect-ratio: auto;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        video {
          object-fit: cover;
        }

        .counter {
          position: absolute;
          z-index: 8;
          top: calc(env(safe-area-inset-top, 0px) + 13px);
          right: 16px;
          margin: 0;
          padding: 7px 11px;
          border: 1px solid rgba(255, 255, 255, 0.2);
          background: rgba(15, 14, 15, 0.58);
          color: #fff7ec;
          font-size: 0.72rem;
          backdrop-filter: blur(12px);
        }

        .controls {
          position: absolute;
          z-index: 8;
          right: 0;
          bottom: 0;
          left: 0;
          display: grid;
          grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr);
          gap: 9px;
          margin: 0;
          padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
          background: linear-gradient(
            180deg,
            transparent,
            rgba(7, 7, 8, 0.72) 18%,
            rgba(7, 7, 8, 0.94) 100%
          );
          backdrop-filter: blur(3px);
        }

        .btn {
          min-height: 46px;
          padding: 10px 8px;
          font-size: 0.78rem;
        }

        .btn-snap {
          grid-column: 2;
          grid-row: 1;
          width: 76px;
          height: 76px;
          min-height: 76px;
          justify-self: center;
          padding: 8px;
          border: 5px solid rgba(255, 246, 232, 0.92);
          border-radius: 50%;
          background: linear-gradient(145deg, #f8dfba, #c58b59);
          color: #25180f;
          font-size: 0.62rem;
          font-weight: 800;
          line-height: 1.1;
          white-space: normal;
          box-shadow:
            0 0 0 2px rgba(220, 172, 119, 0.75),
            0 6px 24px rgba(0, 0, 0, 0.42);
        }

        .btn-snap::after {
          display: none;
        }

        .btn-switch {
          grid-column: 1;
          grid-row: 1;
          width: 48px;
          height: 48px;
          min-height: 48px;
          justify-self: center;
          border-radius: 50%;
          font-size: 1.1rem;
        }

        .btn-upload {
          grid-column: 3;
          grid-row: 1;
          justify-self: center;
          width: 100%;
          max-width: 130px;
          border-radius: 999px;
          font-size: 0.82rem;
        }

        .controls .btn-full {
          width: 100%;
          min-height: 42px;
          margin: 0;
          grid-column: auto;
          border-radius: 999px;
          font-size: 0.74rem;
        }

        #toggleCamBtn {
          grid-column: 1;
          grid-row: 2;
        }

        #albumBtn {
          grid-column: 3;
          grid-row: 2;
        }

        #finishBtn {
          grid-column: 1 / -1;
          grid-row: 3;
          min-height: 32px;
        }

        #status {
          position: absolute;
          z-index: 7;
          top: calc(env(safe-area-inset-top, 0px) + 62px);
          left: 16px;
          max-width: calc(100% - 32px);
          min-height: 0;
          margin: 0;
          padding: 7px 11px;
          border: 1px solid rgba(255, 255, 255, 0.14);
          border-radius: 999px;
          background: rgba(12, 12, 13, 0.55);
          color: #fff3e3;
          font-size: 0.72rem;
          text-align: left;
          backdrop-filter: blur(12px);
        }

        .gallery-container {
          position: absolute;
          z-index: 7;
          right: 0;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 200px);
          left: 0;
          margin: 0;
          padding: 8px 16px;
          background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.2));
        }

        .gallery-item img {
          width: 54px;
          height: 68px;
          border: 1px solid rgba(255, 226, 181, 0.65);
          border-radius: 10px;
        }

        .controls {
          grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr);
        }

        .album-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .modal-content {
          border-radius: 20px;
        }
      }

      @media (max-width: 600px) and (orientation: landscape),
        (max-height: 600px) and (pointer: coarse) and (orientation: landscape) {
        .controls {
          right: 0;
          left: auto;
          width: min(330px, 48vw);
          padding-right: calc(env(safe-area-inset-right, 0px) + 12px);
          padding-left: 12px;
        }

        .card > h2 {
          left: calc(env(safe-area-inset-left, 0px) + 16px);
        }

        .counter {
          right: calc(env(safe-area-inset-right, 0px) + 14px);
        }

        #status {
          top: auto;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 188px);
          left: calc(env(safe-area-inset-left, 0px) + 16px);
        }

        .gallery-container {
          right: 340px;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
          left: calc(env(safe-area-inset-left, 0px) + 12px);
          width: auto;
        }
      }

      @media (min-width: 601px) and (min-height: 601px) {
        .card {
          max-width: 620px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📸 Event Photobooth</h2>
      <div class="counter" id="counter">Sesi Foto: 0 / 35</div>

      <div class="video-wrapper">
        <video
          id="webcam"
          autoplay
          playsinline
          muted
          class="mirror"
        ></video>
        <div id="camOffOverlay" class="cam-off-overlay">
          🔴 Kamera Sedang Off
        </div>
        <div id="flash" class="flash"></div>
      </div>

      <div class="controls">
        <button id="switchBtn" class="btn btn-switch" onclick="switchCamera()">
          🔄
        </button>
        <button
          id="snapBtn"
          class="btn btn-snap"
          onclick="takePhoto()"
          aria-label="Ambil foto"
          disabled
        >
          📸 &nbsp; Jepret Foto
        </button>
        <button
          id="uploadBtn"
          class="btn btn-upload"
          onclick="document.getElementById('fileInput').click()"
        >
          📁 Upload
        </button>

        <button
          id="toggleCamBtn"
          class="btn btn-full btn-cam-off"
          onclick="toggleCamera()"
        >
          ⏹ Matikan Kamera
        </button>
        <button
          id="albumBtn"
          class="btn btn-full btn-album"
          onclick="openAlbum()"
        >
          🖼️ Lihat Album
        </button>
        <button
          id="finishBtn"
          class="btn btn-full btn-finish"
          onclick="finishSession()"
        >
          🏁 Selesai
        </button>
      </div>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        style="display: none"
        onchange="handleFileUpload(event)"
      />
      <div id="status">Meminta akses kamera...</div>

      <div class="gallery-container" id="gallery"></div>
    </div>

    <div id="albumModal" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeAlbum()">&times;</span>
        <h2 style="color: #38bdf8; margin-bottom: 15px">Album Foto</h2>
        <div id="albumGrid" class="album-grid"></div>
      </div>
    </div>

    <canvas id="canvas" style="display: none"></canvas>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbysmZONUTqutpSpyOZDvQVj9LpO5PuGYoTIJiAqZYIWf1uAo4yMS8du_9_x-mkD7i_uEw/exec";

      let photoCount = 0;
      const MAX_PHOTOS = 35;
      let currentStream = null;
      let useFacingMode = "user";
      let isCameraOn = true;
      let photoAlbumData = [];
      let isSessionEnded = false;
      let isCapturingPhoto = false;

      function updateStatus(msg) {
        if (!isSessionEnded) document.getElementById("status").innerHTML = msg;
      }

      function setButtonsState(disabledState) {
        if (isSessionEnded) return;
        document.getElementById("uploadBtn").disabled = disabledState;
        document.getElementById("switchBtn").disabled = disabledState;
        document.getElementById("toggleCamBtn").disabled = disabledState;
        if (disabledState) {
          document.getElementById("snapBtn").disabled = true;
        } else {
          if (photoCount < MAX_PHOTOS && isCameraOn) {
            document.getElementById("snapBtn").disabled = false;
          }
        }
      }

      function initCamera() {
        if (isSessionEnded) return;
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
          currentStream = null;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showCameraError({ name: "SecurityError" });
          return;
        }

        isCameraOn = false;
        const cameraButton = document.getElementById("toggleCamBtn");
        cameraButton.disabled = true;
        cameraButton.innerText = "⏳ Mengaktifkan kamera...";
        document.getElementById("snapBtn").disabled = true;
        document.getElementById("switchBtn").disabled = true;
        const overlay = document.getElementById("camOffOverlay");
        overlay.innerText = "⏳ Izinkan akses kamera pada browser...";
        overlay.style.display = "flex";
        updateStatus("Izinkan akses kamera jika browser menampilkan permintaan izin.");

        navigator.mediaDevices
          .getUserMedia({
            video: {
              facingMode: { ideal: useFacingMode },
              width: { ideal: 4096 },
              height: { ideal: 2160 },
            },
            audio: false,
          })
          .catch((error) => {
            if (
              error.name === "NotAllowedError" ||
              error.name === "SecurityError" ||
              error.name === "NotFoundError"
            ) {
              throw error;
            }

            console.warn(
              "Resolusi tinggi tidak tersedia; mencoba resolusi kamera standar.",
              error,
            );
            return navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: useFacingMode },
                width: { ideal: 1280 },
                height: { ideal: 960 },
              },
              audio: false,
            });
          })
          .then((stream) => {
            currentStream = stream;
            isCameraOn = true;
            const video = document.getElementById("webcam");
            video.srcObject = stream;
            video.muted = true;
            video.playsInline = true;
            const videoTrack = stream.getVideoTracks()[0];
            const cameraSettings = videoTrack.getSettings();
            const actualFacingMode = cameraSettings.facingMode;
            console.info(
              `Resolusi kamera aktif: ${cameraSettings.width || "?"}x${cameraSettings.height || "?"}`,
            );
            if (actualFacingMode) {
              useFacingMode = actualFacingMode;
            }
            video.classList.toggle(
              "mirror",
              (actualFacingMode || useFacingMode) === "user",
            );

            try {
              const focusModes =
                videoTrack.getCapabilities?.().focusMode || [];
              if (focusModes.includes("continuous")) {
                videoTrack
                  .applyConstraints({
                    advanced: [{ focusMode: "continuous" }],
                  })
                  .catch((error) => {
                    console.warn(
                      "Autofokus kamera tidak dapat diaktifkan:",
                      error,
                    );
                  });
              }
            } catch (error) {
              console.warn("Informasi fokus kamera tidak tersedia:", error);
            }

            document.getElementById("camOffOverlay").style.display = "none";
            document.getElementById("switchBtn").disabled = false;
            const cameraButton = document.getElementById("toggleCamBtn");
            cameraButton.disabled = false;
            cameraButton.innerText = "⏹ Matikan Kamera";
            cameraButton.classList.replace("btn-cam-on", "btn-cam-off");
            if (photoCount < MAX_PHOTOS) {
              document.getElementById("snapBtn").disabled = false;
            }
            video.play().catch((error) => {
              console.warn("Preview kamera belum dapat diputar:", error);
              document.getElementById("snapBtn").disabled = true;
              updateStatus(
                "Kamera terhubung. Ketuk area preview untuk mengaktifkan video.",
              );
              video.onclick = function () {
                video.play().then(() => {
                  video.onclick = null;
                  if (photoCount < MAX_PHOTOS) {
                    document.getElementById("snapBtn").disabled = false;
                  }
                  updateStatus("Kamera siap! Silakan jepret foto.");
                });
              };
            });
            if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
              updateStatus("Kamera siap! Silakan jepret foto.");
            } else {
              video.addEventListener(
                "loadeddata",
                () => updateStatus("Kamera siap! Silakan jepret foto."),
                { once: true },
              );
            }
          })
          .catch((error) => {
            console.error("Kamera gagal diaktifkan:", error);
            showCameraError(error);
          });
      }

      function showCameraError(error) {
        const messages = {
          NotAllowedError:
            "Akses kamera ditolak. Izinkan kamera untuk situs ini, lalu tekan “Nyalakan Kamera”.",
          NotFoundError:
            "Kamera tidak ditemukan. Sambungkan atau pilih perangkat kamera yang tersedia.",
          NotReadableError:
            "Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut, lalu coba lagi.",
          AbortError:
            "Kamera gagal memulai. Tutup aplikasi lain yang memakai kamera, lalu tekan “Nyalakan Kamera” untuk mencoba lagi.",
          OverconstrainedError:
            "Kamera tidak mendukung pengaturan yang diminta. Coba pilih kamera lain.",
          SecurityError:
            "Kamera hanya dapat digunakan melalui HTTPS. Buka situs dengan alamat https://.",
        };
        const message =
          messages[error?.name] ||
          `Kamera gagal diaktifkan${error?.message ? `: ${error.message}` : "."}`;
        const overlay = document.getElementById("camOffOverlay");
        overlay.innerText = "📷 Kamera tidak aktif";
        overlay.style.display = "flex";
        const cameraButton = document.getElementById("toggleCamBtn");
        cameraButton.disabled = false;
        cameraButton.innerText = "▶ Nyalakan Kamera";
        cameraButton.classList.replace("btn-cam-off", "btn-cam-on");
        document.getElementById("snapBtn").disabled = true;
        document.getElementById("switchBtn").disabled = false;
        isCameraOn = false;
        updateStatus(`<span style="color:#ef4444; font-weight:bold;">⚠️ ${message}</span>`);
      }

      function switchCamera() {
        if (isSessionEnded) return;
        useFacingMode = useFacingMode === "user" ? "environment" : "user";
        initCamera();
      }

      function toggleCamera() {
        if (isSessionEnded) return;
        const btn = document.getElementById("toggleCamBtn");
        const overlay = document.getElementById("camOffOverlay");

        if (isCameraOn) {
          if (currentStream) {
            currentStream.getTracks().forEach((track) => track.stop());
            currentStream = null;
          }
          document.getElementById("webcam").srcObject = null;
          overlay.style.display = "flex"; // Tampilkan teks kamera off
          document.getElementById("snapBtn").disabled = true;
          document.getElementById("switchBtn").disabled = true;
          btn.innerText = "▶ Nyalakan Kamera";
          btn.classList.replace("btn-cam-off", "btn-cam-on");
          updateStatus("Kamera sedang dimatikan (Off).");
          isCameraOn = false;
        } else {
          overlay.innerText = "⏳ Mengaktifkan kamera...";
          overlay.style.display = "flex";
          initCamera();
        }
      }

      // Tombol Selesai untuk mengakhiri sesi photobooth
      function finishSession() {
        if (
          confirm("Apakah kamu yakin ingin mengakhiri sesi photobooth ini?")
        ) {
          isSessionEnded = true;
          if (currentStream) {
            currentStream.getTracks().forEach((track) => track.stop());
            currentStream = null;
          }
          document.getElementById("webcam").srcObject = null;
          document.getElementById("camOffOverlay").style.display = "flex";
          document.getElementById("camOffOverlay").innerText =
            "🏁 Sesi Photobooth Selesai";

          // Matikan semua tombol
          document.getElementById("snapBtn").disabled = true;
          document.getElementById("uploadBtn").disabled = true;
          document.getElementById("switchBtn").disabled = true;
          document.getElementById("toggleCamBtn").disabled = true;
          document.getElementById("finishBtn").disabled = true;

          updateStatus(
            "<b>Sesi selesai. Terima kasih telah menggunakan photobooth!</b>",
          );
        }
      }

      function triggerFlash() {
        const flash = document.getElementById("flash");
        flash.classList.add("active");
        setTimeout(() => flash.classList.remove("active"), 150);
      }

      function addToGallery(base64Data, localId) {
        photoAlbumData.push({ id: localId, src: base64Data });
        const gallery = document.getElementById("gallery");
        const itemWrapper = document.createElement("div");
        itemWrapper.className = "gallery-item";
        itemWrapper.id = "wrap_" + localId;
        const img = document.createElement("img");
        img.src = base64Data;
        const progress = document.createElement("div");
        progress.className = "upload-progress";
        progress.id = "progress_" + localId;
        const progressLabel = document.createElement("span");
        progressLabel.id = "progress-label_" + localId;
        progressLabel.textContent = "0%";
        const progressTrack = document.createElement("div");
        progressTrack.className = "upload-progress-track";
        const progressFill = document.createElement("div");
        progressFill.className = "upload-progress-fill";
        progressFill.id = "progress-fill_" + localId;
        progressTrack.appendChild(progressFill);
        progress.appendChild(progressLabel);
        progress.appendChild(progressTrack);
        const delBtn = document.createElement("div");
        delBtn.className = "delete-btn";
        delBtn.id = "del_" + localId;
        delBtn.innerHTML = "✖";

        delBtn.onclick = function () {
          if (isSessionEnded) return;
          const fileId = this.dataset.fileId;
          itemWrapper.remove();
          photoCount--;
          document.getElementById("counter").innerText =
            `Sesi Foto: ${photoCount} / ${MAX_PHOTOS}`;
          setButtonsState(false);
          photoAlbumData = photoAlbumData.filter((item) => item.id !== localId);

          if (fileId) {
            updateStatus("Memindahkan foto ke folder Log Hapus...");
            fetch(SCRIPT_URL, {
              method: "POST",
              body: JSON.stringify({ action: "delete", fileId: fileId }),
              headers: { "Content-Type": "text/plain;charset=utf-8" },
            })
              .then((res) => res.json())
              .then((data) => {
                if (data.success) {
                  updateStatus("Foto berhasil dihapus (dipindah ke log).");
                }
              });
          }
        };
        itemWrapper.appendChild(img);
        itemWrapper.appendChild(progress);
        itemWrapper.appendChild(delBtn);
        gallery.appendChild(itemWrapper);
        gallery.scrollLeft = gallery.scrollWidth;
      }

      function updateUploadProgress(localId, percentage, label) {
        const progress = document.getElementById("progress_" + localId);
        const progressLabel = document.getElementById(
          "progress-label_" + localId,
        );
        const progressFill = document.getElementById(
          "progress-fill_" + localId,
        );
        if (!progress || !progressLabel || !progressFill) return;

        const boundedPercentage = Math.max(0, Math.min(100, percentage));
        progressLabel.textContent = label || `${boundedPercentage}%`;
        progressFill.style.width = `${boundedPercentage}%`;
      }

      function processAndUpload(base64Data) {
        if (photoCount >= MAX_PHOTOS || isSessionEnded) return;
        photoCount++;
        const photoNumber = photoCount;
        document.getElementById("counter").innerText =
          `Sesi Foto: ${photoCount} / ${MAX_PHOTOS}`;
        const localId = `photo_${Date.now()}_${photoNumber}`;
        addToGallery(base64Data, localId);

        updateStatus(`⏳ Mengunggah foto ke-${photoNumber}...`);
        let progressValue = 0;
        const progressTimer = setInterval(() => {
          progressValue = Math.min(
            90,
            progressValue + Math.max(1, Math.ceil((90 - progressValue) * 0.08)),
          );
          updateUploadProgress(localId, progressValue);
        }, 180);

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "upload",
            image: base64Data,
            photoIndex: photoNumber,
          }),
          headers: { "Content-Type": "text/plain;charset=utf-8" },
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(
                `Server merespons dengan status ${response.status}.`,
              );
            }
            return response.json();
          })
          .then((res) => {
            clearInterval(progressTimer);
            if (res.success) {
              updateUploadProgress(localId, 100, "100% tersimpan");
              document
                .getElementById("progress_" + localId)
                ?.classList.add("is-complete");
              updateStatus(`✅ Foto ke-${photoNumber} tersimpan!`);
              const delBtn = document.getElementById("del_" + localId);
              if (delBtn) {
                delBtn.dataset.fileId = res.fileId;
                delBtn.style.display = "flex";
              }
              setTimeout(() => {
                document.getElementById("progress_" + localId)?.remove();
              }, 1200);
            } else {
              updateUploadProgress(localId, progressValue, "Gagal");
              document
                .getElementById("progress_" + localId)
                ?.classList.add("is-error");
              updateStatus(
                "❌ Gagal unggah: " + (res.error || "Unknown error"),
              );
            }
          })
          .catch((error) => {
            clearInterval(progressTimer);
            updateUploadProgress(localId, progressValue, "Gagal");
            document
              .getElementById("progress_" + localId)
              ?.classList.add("is-error");
            updateStatus(`❌ Gagal mengunggah foto: ${error.message}`);
          });

        if (photoCount >= MAX_PHOTOS) {
          document.getElementById("snapBtn").disabled = true;
          updateStatus("Sesi penuh (Maksimal 35 foto).");
        }
      }

      function renderCapturedImage(source, width, height) {
        const canvas = document.getElementById("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.save();
        ctx.filter =
          "brightness(1.04) contrast(1.05) saturate(1.08) sepia(0.045)";
        if (useFacingMode === "user") {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(
          source,
          0,
          0,
          width,
          height,
          0,
          0,
          canvas.width,
          canvas.height,
        );
        ctx.restore();
        return canvas.toDataURL("image/jpeg", 1.0);
      }

      async function takePhoto() {
        if (isSessionEnded || isCapturingPhoto) return;
        const video = document.getElementById("webcam");
        if (!currentStream?.active || video.readyState < 2) {
          updateStatus("Tunggu sampai preview kamera siap sebelum mengambil foto.");
          return;
        }

        if (photoCount >= MAX_PHOTOS) {
          updateStatus("Sesi penuh (Maksimal 35 foto).");
          return;
        }

        isCapturingPhoto = true;
        const snapButton = document.getElementById("snapBtn");
        snapButton.disabled = true;
        snapButton.innerText = "⏳ Memotret...";
        triggerFlash();
        updateStatus("Mengambil foto resolusi terbaik...");

        try {
          const track = currentStream.getVideoTracks()[0];
          let photoData;

          if (typeof ImageCapture !== "undefined" && track) {
            try {
              const imageCapture = new ImageCapture(track);
              const photoBlob = await imageCapture.takePhoto();
              const photoBitmap = await createImageBitmap(photoBlob);
              try {
                photoData = renderCapturedImage(
                  photoBitmap,
                  photoBitmap.width,
                  photoBitmap.height,
                );
              } finally {
                photoBitmap.close();
              }
            } catch (error) {
              console.warn(
                "ImageCapture tidak tersedia atau gagal; memakai frame preview sebagai fallback.",
                error,
              );
            }
          }

          if (!photoData) {
            if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
              throw new Error("Preview kamera belum siap untuk mengambil foto.");
            }
            photoData = renderCapturedImage(
              video,
              video.videoWidth,
              video.videoHeight,
            );
          }

          processAndUpload(photoData);
          if (navigator.vibrate) navigator.vibrate(25);
        } catch (error) {
          console.error("Gagal mengambil foto:", error);
          updateStatus(`❌ Gagal mengambil foto: ${error.message}`);
        } finally {
          isCapturingPhoto = false;
          snapButton.innerText = "📸   Jepret Foto";
          snapButton.disabled =
            isSessionEnded ||
            !isCameraOn ||
            !currentStream?.active ||
            photoCount >= MAX_PHOTOS;
        }
      }

      function handleFileUpload(event) {
        if (isSessionEnded) return;
        const files = event.target.files;
        if (files.length > 0) {
          Array.from(files).forEach((file) => {
            if (photoCount < MAX_PHOTOS) {
              const reader = new FileReader();
              reader.onload = function (e) {
                processAndUpload(e.target.result);
              };
              reader.readAsDataURL(file);
            }
          });
          event.target.value = "";
        }
      }

      function openAlbum() {
        const modal = document.getElementById("albumModal");
        const grid = document.getElementById("albumGrid");
        grid.innerHTML =
          '<p style="color:#38bdf8; grid-column: span 3; font-weight:bold;">⏳ Memuat foto dari Google Drive...</p>';
        modal.style.display = "block";

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "get_album" }),
        })
          .then((res) => res.json())
          .then((res) => {
            grid.innerHTML = "";
            if (!res.success) {
              const errorMessage = document.createElement("p");
              errorMessage.style.color = "#ef4444";
              errorMessage.style.gridColumn = "span 3";
              errorMessage.textContent = `Gagal memuat album: ${res.error || "Terjadi kesalahan pada Apps Script."}`;
              grid.replaceChildren(errorMessage);
              return;
            }

            if (!Array.isArray(res.data)) {
              const errorMessage = document.createElement("p");
              errorMessage.style.color = "#ef4444";
              errorMessage.style.gridColumn = "span 3";
              errorMessage.textContent =
                "Respons album Apps Script tidak valid. Periksa deployment Kode.gs.";
              grid.replaceChildren(errorMessage);
              return;
            }

            const photos = res.data.filter(
              (photo) =>
                photo &&
                typeof photo.id === "string" &&
                typeof photo.mimeType === "string" &&
                photo.mimeType.startsWith("image/"),
            );

            if (photos.length > 0) {
              photos.forEach((photo) => {
                const card = document.createElement("div");
                card.className = "album-card";
                const img = document.createElement("img");
                img.alt = "Foto album";
                img.loading = "lazy";
                const imageError = document.createElement("div");
                imageError.className = "album-image-error";
                imageError.hidden = true;
                const errorText = document.createElement("span");
                errorText.textContent =
                  "Foto gagal dimuat. File mungkin belum dibagikan untuk akses publik.";
                imageError.appendChild(errorText);
                if (photo.id) {
                  const driveLink = document.createElement("a");
                  driveLink.href = `https://drive.google.com/file/d/${encodeURIComponent(photo.id)}/view`;
                  driveLink.target = "_blank";
                  driveLink.rel = "noopener noreferrer";
                  driveLink.textContent = "Coba buka di Google Drive";
                  imageError.appendChild(driveLink);
                }
                const imageUrls = [
                  photo.url,
                  photo.id
                    ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(photo.id)}&sz=w1000`
                    : null,
                  photo.id
                    ? `https://lh3.googleusercontent.com/d/${encodeURIComponent(photo.id)}=w1600`
                    : null,
                  photo.id
                    ? `https://drive.google.com/uc?export=view&id=${encodeURIComponent(photo.id)}`
                    : null,
                ].filter(
                  (url, index, urls) =>
                    typeof url === "string" &&
                    url &&
                    urls.indexOf(url) === index,
                );
                let imageUrlIndex = 0;
                img.onerror = function () {
                  imageUrlIndex++;
                  if (imageUrlIndex < imageUrls.length) {
                    img.src = imageUrls[imageUrlIndex];
                  } else {
                    img.alt = "Foto tidak dapat ditampilkan";
                    img.title =
                      "Foto gagal dimuat. Periksa izin akses file di Google Drive.";
                    img.hidden = true;
                    imageError.hidden = false;
                  }
                };
                img.onload = function () {
                  imageError.hidden = true;
                };
                if (imageUrls.length > 0) {
                  img.src = imageUrls[imageUrlIndex];
                } else {
                  img.alt = "URL foto tidak tersedia";
                }

                const likeBtn = document.createElement("button");
                likeBtn.className = "like-btn";
                likeBtn.innerHTML = `❤️ <span id="like-${photo.id}">${photo.likes}</span>`;
                likeBtn.onclick = function () {
                  likePhoto(photo.id, likeBtn);
                };

                card.appendChild(img);
                card.appendChild(imageError);
                card.appendChild(likeBtn);
                grid.appendChild(card);
              });
            } else if (res.data.some((item) => item && !item.mimeType)) {
              const errorMessage = document.createElement("p");
              errorMessage.style.color = "#ef4444";
              errorMessage.style.gridColumn = "span 3";
              errorMessage.textContent =
                "Apps Script masih memakai format lama. Deploy ulang Code.gs agar hanya foto yang dimuat.";
              grid.replaceChildren(errorMessage);
            } else {
              grid.innerHTML =
                '<p style="color:#94a3b8; grid-column: span 3;">Belum ada file foto di Master Folder.</p>';
            }
          })
          .catch((err) => {
            const errorMessage = document.createElement("p");
            errorMessage.style.color = "#ef4444";
            errorMessage.style.gridColumn = "span 3";
            errorMessage.textContent = `Gagal memuat album: ${err.message || "Periksa koneksi dan URL Apps Script."}`;
            grid.replaceChildren(errorMessage);
          });
      }

      function likePhoto(fileId, btnElement) {
        btnElement.disabled = true;
        const countSpan = document.getElementById("like-" + fileId);
        let currentLikes = parseInt(countSpan.innerText);
        countSpan.innerText = currentLikes + 1;

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "like_photo", fileId: fileId }),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.success) {
              countSpan.innerText = res.likes;
            }
            btnElement.disabled = false;
          })
          .catch((err) => {
            countSpan.innerText = currentLikes;
            btnElement.disabled = false;
          });
      }

      function closeAlbum() {
        document.getElementById("albumModal").style.display = "none";
      }
      window.onclick = function (event) {
        if (event.target == document.getElementById("albumModal")) {
          closeAlbum();
        }
      };

      initCamera();
    </script>
  </body>
</html>
