<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; }
    .counter { 
      font-size: 1rem; 
      font-weight: 600; 
      background: #334155; 
      padding: 6px 16px; 
      border-radius: 20px; 
      display: inline-block;
      margin-bottom: 16px;
    }
    .video-wrapper { 
      position: relative; 
      width: 100%; 
      aspect-ratio: 3/4; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .mirror { transform: scaleX(-1); }
    .flash {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out;
    }
    .flash.active { opacity: 0.8; }
    .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
    .btn { 
      flex: 1; background: #ef4444; color: white; border: none; padding: 16px; 
      font-size: 1.1rem; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
    .btn-switch { flex: 0 0 54px; background: #334155; font-size: 1.2rem; }
    #status { margin-top: 14px; font-size: 0.85rem; color: #94a3b8; min-height: 20px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📸 Event Photobooth</h2>
    <div class="counter" id="counter">Foto: 0 / 35</div>

    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline class="mirror"></video>
      <div id="flash" class="flash"></div>
    </div>

    <div class="controls">
      <button id="switchBtn" class="btn btn-switch" onclick="switchCamera()">🔄</button>
      <button id="snapBtn" class="btn" onclick="takePhoto()" disabled>📷 Ambil Foto</button>
    </div>
    
    <div id="status">Meminta akses kamera...</div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // MASUKKAN LINK APPS SCRIPT KAMU DI SINI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJ7shVEraoFi0_vhDz1nXD8uP1v0QTl9UsO6Dh4HUV1BRgEDaDKCbQxdYpV-_xsF5P2A/exec'; 
    
    let photoCount = 0;
    const MAX_PHOTOS = 35;
    let currentStream = null;
    let useFacingMode = 'user';

    function updateStatus(msg) {
      document.getElementById('status').innerHTML = msg;
    }

    function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      
      const constraints = {
        video: { facingMode: useFacingMode, width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          currentStream = stream;
          const video = document.getElementById('webcam');
          video.srcObject = stream;
          if (useFacingMode === 'user') {
            video.classList.add('mirror');
          } else {
            video.classList.remove('mirror');
          }
          document.getElementById('snapBtn').disabled = false;
          updateStatus("Kamera siap! Silakan jepret foto.");
        })
        .catch(err => {
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            updateStatus('<span style="color:#ef4444; font-weight:bold;">⚠️ Akses Kamera Ditolak!</span><br>Silakan izinkan kamera di pengaturan browser.');
            document.getElementById('snapBtn').disabled = true;
          } else {
            alert("Gagal membuka kamera: " + err.message);
          }
        });
    }

    function switchCamera() {
      useFacingMode = (useFacingMode === 'user') ? 'environment' : 'user';
      initCamera();
    }

    function triggerFlash() {
      const flash = document.getElementById('flash');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 150);
    }

    function takePhoto() {
      if (photoCount >= MAX_PHOTOS) return;

      triggerFlash();
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext('2d');
      if (useFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Data = canvas.toDataURL('image/jpeg', 0.85);

      photoCount++;
      document.getElementById('counter').innerText = `Foto: ${photoCount} / ${MAX_PHOTOS}`;
      updateStatus(`Mengunggah foto ke-${photoCount}...`);

      // Mengirim data ke Apps Script menggunakan Fetch API
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ image: base64Data, photoIndex: photoCount }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(response => response.json())
      .then(res => {
        if (res.success) {
          updateStatus(`Foto ke-${photoCount} tersimpan!`);
        } else {
          updateStatus("Gagal unggah: " + res.error);
        }
        
        if (photoCount >= MAX_PHOTOS) {
          document.getElementById('snapBtn').disabled = true;
          updateStatus("Sesi selesai (Maksimal 35 foto tercapai). Terima kasih!");
        }
      })
      .catch(error => {
        updateStatus("Terjadi kesalahan jaringan.");
        console.error('Error:', error);
      });
    }

    initCamera();
  </script>
</body>
</html>
