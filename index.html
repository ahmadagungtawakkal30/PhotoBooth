<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Event Photobooth</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }

      /* Tampilan Utama */
      .card {
        background: #1e293b;
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      h2 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        color: #38bdf8;
      }
      .counter {
        font-size: 1rem;
        font-weight: 600;
        background: #334155;
        padding: 6px 16px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 16px;
      }
      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 3/4;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .mirror {
        transform: scaleX(-1);
      }
      .flash {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s ease-out;
      }
      .flash.active {
        opacity: 0.8;
      }

      /* Tombol Kontrol */
      .controls {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        color: white;
        border: none;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        background: #475569 !important;
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }
      .btn-snap {
        background: #ef4444;
      }
      .btn-upload {
        background: #3b82f6;
      }
      .btn-switch {
        flex: 0 0 50px;
        background: #334155;
        font-size: 1.2rem;
      }
      .btn-full {
        width: 100%;
        flex: 100%;
        margin-top: 4px;
      }
      .btn-cam-off {
        background: #64748b;
      }
      .btn-cam-on {
        background: #10b981;
      }
      .btn-album {
        background: #8b5cf6;
      }

      #status {
        margin-top: 14px;
        font-size: 0.85rem;
        color: #94a3b8;
        min-height: 20px;
        line-height: 1.4;
        font-weight: 500;
      }

      /* Galeri Mini (Sesi Lokal) */
      .gallery-container {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
        scroll-behavior: smooth;
      }
      .gallery-item {
        position: relative;
        flex-shrink: 0;
      }
      .gallery-item img {
        width: 60px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #38bdf8;
        background: #334155;
      }
      .delete-btn {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 14px;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
        border: 2px solid #1e293b;
      }

      /* Modal Album Server & Fitur Like */
      .modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        overflow-y: auto;
        padding: 20px;
        backdrop-filter: blur(5px);
      }
      .modal-content {
        background: #1e293b;
        margin: 40px auto;
        padding: 24px;
        border-radius: 16px;
        max-width: 600px;
        text-align: center;
      }
      .close-modal {
        color: #94a3b8;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .close-modal:hover {
        color: #ef4444;
      }

      .album-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .album-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .album-card img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #334155;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .like-btn {
        background: #334155;
        border: 1px solid #475569;
        color: white;
        padding: 8px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: 0.2s;
      }
      .like-btn:hover {
        background: #475569;
      }
      .like-btn:active {
        transform: scale(0.95);
      }
      .like-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Media Query Laptop */
      @media (min-width: 768px) {
        .card {
          max-width: 600px;
          padding: 30px;
        }
        h2 {
          font-size: 1.8rem;
        }
        .counter {
          font-size: 1.1rem;
        }
        .btn {
          font-size: 1.1rem;
          padding: 16px;
        }
        .gallery-item img {
          width: 75px;
          height: 100px;
        }
        .album-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📸 Event Photobooth</h2>
      <div class="counter" id="counter">Sesi Foto: 0 / 35</div>

      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline class="mirror"></video>
        <div id="flash" class="flash"></div>
      </div>

      <div class="controls">
        <button id="switchBtn" class="btn btn-switch" onclick="switchCamera()">
          🔄
        </button>
        <button
          id="snapBtn"
          class="btn btn-snap"
          onclick="takePhoto()"
          disabled
        >
          📷 Jepret
        </button>
        <button
          id="uploadBtn"
          class="btn btn-upload"
          onclick="document.getElementById('fileInput').click()"
        >
          📁 Upload
        </button>

        <button
          id="toggleCamBtn"
          class="btn btn-full btn-cam-off"
          onclick="toggleCamera()"
        >
          ⏹ Matikan Kamera
        </button>
        <button
          id="albumBtn"
          class="btn btn-full btn-album"
          onclick="openAlbum()"
        >
          🖼️ Lihat Album Keseluruhan
        </button>
      </div>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        style="display: none"
        onchange="handleFileUpload(event)"
      />
      <div id="status">Meminta akses kamera...</div>

      <div class="gallery-container" id="gallery"></div>
    </div>

    <div id="albumModal" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeAlbum()">&times;</span>
        <h2 style="color: #38bdf8; margin-bottom: 5px">Album Foto Server</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px">
          Menampilkan semua foto dari Drive, diurutkan dari Like terbanyak.
        </p>
        <div id="albumGrid" class="album-grid"></div>
      </div>
    </div>

    <canvas id="canvas" style="display: none"></canvas>

    <script>
      // Link Apps Script Kamu
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzdE7xHeDoN-hD5XSI1a7GABauzFtG-6YdewjD4p9t27_INIAEHohskf4rQ0jnW8BVK4Q/exec";

      let photoCount = 0;
      const MAX_PHOTOS = 35;
      let currentStream = null;
      let useFacingMode = "user";
      let isCameraOn = true;
      let photoAlbumData = []; // Untuk UI lokal saat jepret

      function updateStatus(msg) {
        document.getElementById("status").innerHTML = msg;
      }

      function setButtonsState(disabledState) {
        document.getElementById("uploadBtn").disabled = disabledState;
        document.getElementById("switchBtn").disabled = disabledState;
        if (disabledState) {
          document.getElementById("snapBtn").disabled = true;
        } else {
          if (photoCount < MAX_PHOTOS && isCameraOn) {
            document.getElementById("snapBtn").disabled = false;
          }
        }
      }

      function initCamera() {
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
        }
        navigator.mediaDevices
          .getUserMedia({
            video: {
              facingMode: useFacingMode,
              width: { ideal: 1280 },
              height: { ideal: 960 },
            },
            audio: false,
          })
          .then((stream) => {
            currentStream = stream;
            const video = document.getElementById("webcam");
            video.srcObject = stream;
            video.classList.toggle("mirror", useFacingMode === "user");
            if (photoCount < MAX_PHOTOS) {
              document.getElementById("snapBtn").disabled = false;
            }
            updateStatus("Kamera siap! Silakan jepret foto.");
          })
          .catch((err) => {
            updateStatus(
              '<span style="color:#ef4444; font-weight:bold;">⚠️ Kamera tidak diizinkan/tidak tersedia.</span>',
            );
            document.getElementById("snapBtn").disabled = true;
          });
      }

      function switchCamera() {
        if (!isCameraOn) return;
        useFacingMode = useFacingMode === "user" ? "environment" : "user";
        initCamera();
      }

      function toggleCamera() {
        const btn = document.getElementById("toggleCamBtn");
        if (isCameraOn) {
          if (currentStream) {
            currentStream.getTracks().forEach((track) => track.stop());
            currentStream = null;
          }
          document.getElementById("webcam").srcObject = null;
          document.getElementById("snapBtn").disabled = true;
          document.getElementById("switchBtn").disabled = true;
          btn.innerText = "▶ Nyalakan Kamera";
          btn.classList.replace("btn-cam-off", "btn-cam-on");
          updateStatus("Kamera dimatikan.");
          isCameraOn = false;
        } else {
          initCamera();
          document.getElementById("switchBtn").disabled = false;
          btn.innerText = "⏹ Matikan Kamera";
          btn.classList.replace("btn-cam-on", "btn-cam-off");
          isCameraOn = true;
        }
      }

      function triggerFlash() {
        const flash = document.getElementById("flash");
        flash.classList.add("active");
        setTimeout(() => flash.classList.remove("active"), 150);
      }

      function addToGallery(base64Data, localId) {
        photoAlbumData.push({ id: localId, src: base64Data });
        const gallery = document.getElementById("gallery");
        const itemWrapper = document.createElement("div");
        itemWrapper.className = "gallery-item";
        itemWrapper.id = "wrap_" + localId;
        const img = document.createElement("img");
        img.src = base64Data;
        const delBtn = document.createElement("div");
        delBtn.className = "delete-btn";
        delBtn.id = "del_" + localId;
        delBtn.innerHTML = "✖";

        // Logika Menghapus Foto Lokal & Memindah ke Log Drive
        delBtn.onclick = function () {
          const fileId = this.dataset.fileId;
          itemWrapper.remove();
          photoCount--;
          document.getElementById("counter").innerText =
            `Sesi Foto: ${photoCount} / ${MAX_PHOTOS}`;
          setButtonsState(false);
          photoAlbumData = photoAlbumData.filter((item) => item.id !== localId);

          if (fileId) {
            updateStatus("Memindahkan foto ke folder Log Hapus...");
            fetch(SCRIPT_URL, {
              method: "POST",
              body: JSON.stringify({ action: "delete", fileId: fileId }),
              headers: { "Content-Type": "text/plain;charset=utf-8" },
            })
              .then((res) => res.json())
              .then((data) => {
                if (data.success) {
                  updateStatus("Foto berhasil dihapus (dipindah ke log).");
                }
              });
          }
        };
        itemWrapper.appendChild(img);
        itemWrapper.appendChild(delBtn);
        gallery.appendChild(itemWrapper);
        gallery.scrollLeft = gallery.scrollWidth;
      }

      function processAndUpload(base64Data) {
        if (photoCount >= MAX_PHOTOS) return;
        photoCount++;
        document.getElementById("counter").innerText =
          `Sesi Foto: ${photoCount} / ${MAX_PHOTOS}`;
        const localId = "photo_" + Date.now();
        addToGallery(base64Data, localId);

        updateStatus(`⏳ Mengunggah foto ke-${photoCount}...`);
        setButtonsState(true);

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "upload",
            image: base64Data,
            photoIndex: photoCount,
          }),
          headers: { "Content-Type": "text/plain;charset=utf-8" },
        })
          .then((response) => response.json())
          .then((res) => {
            if (res.success) {
              updateStatus(`✅ Foto ke-${photoCount} tersimpan!`);
              const delBtn = document.getElementById("del_" + localId);
              if (delBtn) {
                delBtn.dataset.fileId = res.fileId;
                delBtn.style.display = "flex";
              }
            } else {
              updateStatus("❌ Gagal unggah: " + res.error);
            }
          })
          .catch((error) => {
            updateStatus("❌ Terjadi kesalahan jaringan.");
          })
          .finally(() => {
            setButtonsState(false);
            if (photoCount >= MAX_PHOTOS) {
              document.getElementById("snapBtn").disabled = true;
              updateStatus("Sesi penuh (Maksimal 35 foto).");
            }
          });
      }

      function takePhoto() {
        triggerFlash();
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext("2d");
        if (useFacingMode === "user") {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        processAndUpload(canvas.toDataURL("image/jpeg", 0.8));
      }

      function handleFileUpload(event) {
        const files = event.target.files;
        if (files.length > 0) {
          Array.from(files).forEach((file) => {
            if (photoCount < MAX_PHOTOS) {
              const reader = new FileReader();
              reader.onload = function (e) {
                processAndUpload(e.target.result);
              };
              reader.readAsDataURL(file);
            }
          });
          event.target.value = "";
        }
      }

      // MEMUAT DAN MENAMPILKAN ALBUM SERVER (DARI DRIVE)
      function openAlbum() {
        const modal = document.getElementById("albumModal");
        const grid = document.getElementById("albumGrid");
        grid.innerHTML =
          '<p style="color:#38bdf8; grid-column: span 3; font-weight:bold;">⏳ Memuat foto dari Google Drive...</p>';
        modal.style.display = "block";

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "get_album" }),
        })
          .then((res) => res.json())
          .then((res) => {
            grid.innerHTML = "";
            if (res.success && res.data.length > 0) {
              res.data.forEach((photo) => {
                const card = document.createElement("div");
                card.className = "album-card";
                const img = document.createElement("img");
                img.src = photo.url;
                img.loading = "lazy";

                const likeBtn = document.createElement("button");
                likeBtn.className = "like-btn";
                likeBtn.innerHTML = `❤️ <span id="like-${photo.id}">${photo.likes}</span>`;
                likeBtn.onclick = function () {
                  likePhoto(photo.id, likeBtn);
                };

                card.appendChild(img);
                card.appendChild(likeBtn);
                grid.appendChild(card);
              });
            } else {
              grid.innerHTML =
                '<p style="color:#94a3b8; grid-column: span 3;">Belum ada foto di Master Folder.</p>';
            }
          })
          .catch((err) => {
            grid.innerHTML =
              '<p style="color:#ef4444; grid-column: span 3;">Gagal memuat album.</p>';
          });
      }

      // FUNGSI MENGIRIM LIKE KE SERVER
      function likePhoto(fileId, btnElement) {
        btnElement.disabled = true;
        const countSpan = document.getElementById("like-" + fileId);
        let currentLikes = parseInt(countSpan.innerText);
        countSpan.innerText = currentLikes + 1; // Update UI cepat

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "like_photo", fileId: fileId }),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.success) {
              countSpan.innerText = res.likes;
            } // Nilai sah dari server
            btnElement.disabled = false;
          })
          .catch((err) => {
            countSpan.innerText = currentLikes; // Kembalikan jika error
            btnElement.disabled = false;
          });
      }

      function closeAlbum() {
        document.getElementById("albumModal").style.display = "none";
      }
      window.onclick = function (event) {
        if (event.target == document.getElementById("albumModal")) {
          closeAlbum();
        }
      };

      initCamera();
    </script>
  </body>
</html>
